<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Cashier | Sky Sweet Treats</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="images/logo.jpg">
    <style>
        body { padding-bottom: 40px; }
        .container { max-width: 500px; }
        #login-screen { max-width: 380px; margin: 60px auto; padding: 0 16px; }
        .login-box { background: white; border-radius: var(--radius); padding: 30px; box-shadow: var(--shadow); }
        .login-box h2 { text-align: center; color: var(--primary); margin-bottom: 20px; }
        .login-box input { width: 100%; padding: 14px; border: 2px solid #ddd; border-radius: var(--radius-sm); margin-bottom: 12px; font-family: inherit; font-size: 0.95rem; }
        .login-error { color: #C62828; font-size: 0.85rem; text-align: center; margin-top: 8px; display: none; }

        #cashier-screen { display: none; }
        .dash-header { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; }
        .dash-header h1 { font-size: 1.15rem; color: var(--primary); }
        .logout-btn { background: none; border: 2px solid #ddd; border-radius: 30px; padding: 6px 14px; font-size: 0.8rem; cursor: pointer; color: var(--text-medium); }

        .mode-tabs { display: flex; gap: 8px; margin-bottom: 16px; }
        .mode-tab { flex: 1; background: #f1f3f5; border: none; padding: 12px; border-radius: var(--radius-sm); font-weight: 700; font-size: .9rem; cursor: pointer; color: var(--text-medium); }
        .mode-tab.active { background: var(--primary); color: white; }

        #scan-panel { display: none; }
        #reader { width: 100%; border-radius: var(--radius); overflow: hidden; }
        #scan-hint { text-align: center; color: var(--text-medium); font-size: .85rem; margin-top: 10px; }

        #manual-panel { display: none; }
        .manual-form { display: flex; gap: 10px; }
        .manual-form input { flex: 1; padding: 14px; border: 2px solid #ddd; border-radius: var(--radius-sm); font-family: inherit; font-size: .95rem; text-transform: uppercase; }
        .manual-form button { background: var(--primary); color: white; border: none; padding: 0 20px; border-radius: var(--radius-sm); font-weight: 700; cursor: pointer; }

        #lookup-empty { text-align: center; color: var(--text-light); padding: 40px 10px; }

        .order-result { background: white; border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); border-left: 5px solid var(--primary); margin-top: 18px; }
        .order-result.status-cancelled { border-left-color: #C62828; }
        .order-result.status-completed { border-left-color: #2E7D32; }
        .order-num-big { font-size: 1.3rem; font-weight: 700; color: var(--primary); }
        .order-customer { font-weight: 600; margin: 6px 0 2px; }
        .order-items-list { font-size: .9rem; color: var(--text-dark); background: #fafafa; border-radius: var(--radius-sm); padding: 10px 12px; margin: 10px 0; }
        .order-items-list div { padding: 2px 0; }
        .order-total-row { display: flex; justify-content: space-between; font-weight: 700; font-size: 1.05rem; margin-bottom: 10px; }
        .order-badges { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
        .obadge { font-size: 0.7rem; font-weight: 700; padding: 4px 12px; border-radius: 20px; text-transform: uppercase; }
        .obadge.pending { background: #FFF3E0; color: #E65100; }
        .obadge.accepted { background: #E3F2FD; color: #1565C0; }
        .obadge.preparing { background: #F3E5F5; color: #6A1B9A; }
        .obadge.ready { background: #E8F5E9; color: #2E7D32; }
        .obadge.completed { background: #E0E0E0; color: #424242; }
        .obadge.cancelled { background: #FFEBEE; color: #C62828; }
        .obadge.unpaid { background: #FFEBEE; color: #C62828; }
        .obadge.awaiting_confirmation { background: #FFF3E0; color: #E65100; }
        .obadge.paid { background: #E8F5E9; color: #2E7D32; }
        .order-actions { display: flex; gap: 8px; flex-wrap: wrap; }
        .action-btn { flex: 1; min-width: 100px; border: none; padding: 12px; border-radius: var(--radius-sm); font-weight: 700; font-size: .85rem; cursor: pointer; color: white; }
        .action-btn.accept { background: #1565C0; }
        .action-btn.preparing { background: #6A1B9A; }
        .action-btn.ready { background: #2E7D32; }
        .action-btn.complete { background: #388E3C; }
        .action-btn.cancel { background: #C62828; }
        .action-btn.paid { background: #F9A825; }
        .scan-again-btn { display: block; width: 100%; margin-top: 16px; background: #f1f3f5; border: none; padding: 12px; border-radius: var(--radius-sm); font-weight: 700; cursor: pointer; color: var(--text-medium); }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-box">
            <h2>🔐 Cashier Login</h2>
            <input type="email" id="login-email" placeholder="Email" autocomplete="username">
            <input type="password" id="login-password" placeholder="Password" autocomplete="current-password">
            <button class="btn-primary" onclick="doLogin()">Log In</button>
            <div class="login-error" id="login-error"></div>
        </div>
    </div>

    <div id="cashier-screen">
        <div class="container">
            <div class="dash-header">
                <h1>🧾 Cashier — Scan Order</h1>
                <button class="logout-btn" onclick="doLogout()">Log out</button>
            </div>

            <div class="mode-tabs">
                <button class="mode-tab active" id="tab-scan" onclick="switchMode('scan')">📷 Scan QR</button>
                <button class="mode-tab" id="tab-manual" onclick="switchMode('manual')">⌨️ Type Number</button>
            </div>

            <div id="scan-panel">
                <div id="reader"></div>
                <div id="scan-hint">Point the camera at the customer's order QR code</div>
            </div>

            <div id="manual-panel">
                <div class="manual-form">
                    <input type="text" id="order-input" placeholder="e.g. SST-260827-001" autocomplete="off">
                    <button onclick="lookupOrder(document.getElementById('order-input').value)">🔍 Find</button>
                </div>
            </div>

            <div id="lookup-empty">🔎 Scan or type an order number to look it up</div>
            <div id="order-result-box"></div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script>
        const supabaseUrl = "https://rmtberbypsjcydomvhvu.supabase.co";
        const supabaseAnonKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJtdGJlcmJ5cHNqY3lkb212aHZ1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc4MTU0NDYsImV4cCI6MjEwMzM5MTQ0Nn0.mgo9Cj8ManeLMF9DVA__7a4iAZ7OmYu81NkAEY7Pov0";
        const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseAnonKey, {
            auth: { persistSession: true, autoRefreshToken: true }
        });

        let html5QrCode = null;
        let currentOrder = null;

        function showToast(message, duration = 2500) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), duration);
        }

        // ============ AUTH ============
        async function doLogin() {
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;
            const errBox = document.getElementById('login-error');
            errBox.style.display = 'none';
            if (!email || !password) {
                errBox.textContent = 'Please enter email and password';
                errBox.style.display = 'block';
                return;
            }
            const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) {
                errBox.textContent = '❌ ' + error.message;
                errBox.style.display = 'block';
                return;
            }
            enterCashier();
        }

        async function doLogout() {
            stopScanner();
            await supabaseClient.auth.signOut();
            document.getElementById('cashier-screen').style.display = 'none';
            document.getElementById('login-screen').style.display = 'block';
        }

        function enterCashier() {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('cashier-screen').style.display = 'block';
            switchMode('scan');
        }

        // ============ MODE SWITCH ============
        function switchMode(mode) {
            document.getElementById('tab-scan').classList.toggle('active', mode === 'scan');
            document.getElementById('tab-manual').classList.toggle('active', mode === 'manual');
            document.getElementById('scan-panel').style.display = mode === 'scan' ? 'block' : 'none';
            document.getElementById('manual-panel').style.display = mode === 'manual' ? 'block' : 'none';
            if (mode === 'scan') {
                startScanner();
            } else {
                stopScanner();
            }
        }

        function startScanner() {
            if (html5QrCode) return;
            html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 220, height: 220 } },
                (decodedText) => {
                    lookupOrder(decodedText);
                    stopScanner();
                    document.getElementById('scan-hint').textContent = '✅ Scanned! Tap "Scan QR" again for the next order.';
                },
                () => {}
            ).catch(() => {
                document.getElementById('scan-hint').textContent = '⚠️ Camera unavailable — use "Type Number" instead.';
            });
        }

        function stopScanner() {
            if (html5QrCode) {
                html5QrCode.stop().then(() => html5QrCode.clear()).catch(() => {});
                html5QrCode = null;
            }
        }

        // ============ ORDER LOOKUP ============
        async function lookupOrder(rawInput) {
            const orderNumber = (rawInput || '').trim().toUpperCase();
            if (!orderNumber) return showToast('⚠️ Enter or scan an order number');

            const { data: orders, error } = await supabaseClient
                .from('orders')
                .select('*')
                .eq('order_number', orderNumber)
                .limit(1);

            if (error) { showToast('❌ Lookup failed'); console.error(error); return; }
            if (!orders || orders.length === 0) {
                document.getElementById('order-result-box').innerHTML = '';
                document.getElementById('lookup-empty').style.display = 'block';
                document.getElementById('lookup-empty').textContent = '❌ Order not found: ' + orderNumber;
                return showToast('❌ Order not found');
            }

            currentOrder = orders[0];

            const { data: items, error: itemsErr } = await supabaseClient
                .from('order_items')
                .select('*')
                .eq('order_id', currentOrder.id);

            renderOrder(currentOrder, itemsErr ? [] : (items || []));
            document.getElementById('lookup-empty').style.display = 'none';
        }

        function orderActionsHtml(o) {
            const btns = [];
            if (o.status === 'pending') {
                btns.push(`<button class="action-btn accept" onclick="updateStatus('${o.id}','accepted')">✅ Accept</button>`);
                btns.push(`<button class="action-btn cancel" onclick="updateStatus('${o.id}','cancelled')">❌ Reject</button>`);
            } else if (o.status === 'accepted') {
                btns.push(`<button class="action-btn preparing" onclick="updateStatus('${o.id}','preparing')">👩‍🍳 Preparing</button>`);
                btns.push(`<button class="action-btn cancel" onclick="updateStatus('${o.id}','cancelled')">❌ Cancel</button>`);
            } else if (o.status === 'preparing') {
                btns.push(`<button class="action-btn ready" onclick="updateStatus('${o.id}','ready')">📦 Mark Ready</button>`);
            } else if (o.status === 'ready') {
                btns.push(`<button class="action-btn complete" onclick="updateStatus('${o.id}','completed')">🎉 Complete</button>`);
            }
            if (o.payment_status !== 'paid' && o.status !== 'cancelled') {
                btns.push(`<button class="action-btn paid" onclick="markPaid('${o.id}')">💰 Mark Paid</button>`);
            }
            return btns.join('');
        }

        function renderOrder(o, items) {
            const itemsHtml = items.map(it =>
                `<div>${it.qty}x ${it.product_name}${it.flavor ? ' (' + it.flavor + ')' : ''} — ₱${(it.price * it.qty).toFixed(2)}</div>`
            ).join('');
            const time = new Date(o.created_at).toLocaleString('en-PH', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });

            document.getElementById('order-result-box').innerHTML = `
                <div class="order-result status-${o.status}">
                    <div class="order-num-big">${o.order_number}</div>
                    <div style="font-size:.75rem;color:var(--text-light);">${time}</div>
                    <div class="order-customer">👤 ${o.customer_name}</div>
                    <div class="order-items-list">${itemsHtml || '<em>No items recorded</em>'}</div>
                    <div class="order-total-row"><span>Total</span><span>₱${parseFloat(o.total).toFixed(2)}</span></div>
                    <div class="order-badges">
                        <span class="obadge ${o.status}">${o.status}</span>
                        <span class="obadge ${o.payment_status}">${o.payment_status.replace('_',' ')}</span>
                        <span class="obadge" style="background:#eee;color:#555;">${o.payment_method}</span>
                    </div>
                    <div class="order-actions">${orderActionsHtml(o)}</div>
                </div>
                <button class="scan-again-btn" onclick="resetLookup()">🔄 Next customer</button>
            `;
        }

        function resetLookup() {
            currentOrder = null;
            document.getElementById('order-result-box').innerHTML = '';
            document.getElementById('order-input').value = '';
            document.getElementById('lookup-empty').style.display = 'block';
            document.getElementById('lookup-empty').textContent = '🔎 Scan or type an order number to look it up';
            if (document.getElementById('tab-scan').classList.contains('active')) startScanner();
        }

        window.updateStatus = async function(orderId, status) {
            const { error } = await supabaseClient.from('orders').update({ status }).eq('id', orderId);
            if (error) return showToast('❌ Could not update order');
            showToast(`✅ Order marked as ${status}`);
            lookupOrder(currentOrder.order_number);
        };

        window.markPaid = async function(orderId) {
            const { error } = await supabaseClient.from('orders').update({ payment_status: 'paid' }).eq('id', orderId);
            if (error) return showToast('❌ Could not update payment status');
            showToast('💰 Marked as paid');
            lookupOrder(currentOrder.order_number);
        };

        // ============ INIT ============
        window.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) enterCashier();
        });

        document.getElementById('order-input')?.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') lookupOrder(e.target.value);
        });
    </script>
</body>
</html>
